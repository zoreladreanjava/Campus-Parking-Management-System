<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TeamParker campus parking front-end prototype for CIT-University.">
<title>03 • Guard / vehicle entry | TeamParker</title>
<link rel="stylesheet" href="css/styles.css">
<script src="js/app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="guard-shell"><header class="state-bar entry"><h1>Vehicle entry</h1><span data-param="time">08:15</span></header>
<main id="main" class="guard-main"><div class="vehicle-id"><span class="plate" data-param="plate">MC-1234</span>
<p class="person"><strong data-param="owner">John Doe</strong> <span data-param="type">Motorcycle</span></p></div>
<p class="guard-statement">Parking available. Confirm the plate, then record the owner&#39;s chosen area.</p>
<div class="area-buttons" role="group" aria-label="Owner's chosen area">
<a class="area-button" data-carry href="entrydone.html?area=Area+A"><span class="area-label"><span class="name">Area A</span><span class="free num">30 free</span></span><span class="pill">Record entry</span></a>
<a class="area-button" data-carry href="entrydone.html?area=Area+B"><span class="area-label"><span class="name">Area B</span><span class="free num">40 free</span></span><span class="pill">Record entry</span></a>
<div class="area-button is-full" aria-disabled="true"><span class="area-label"><span class="name">Area C</span></span><span class="full-text"><b>FULL</b><span>No slots</span></span></div></div>
<div class="guard-actions"><p class="hint">Wrong vehicle?</p>
<a class="guard-button" href="guard.html">Cancel</a></div></main></div>
</body>
</html>

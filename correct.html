<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TeamParker campus parking front-end prototype for CIT-University.">
<title>08 • Guard / correct a record | TeamParker</title>
<link rel="stylesheet" href="css/styles.css">
<script src="js/app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="guard-shell"><header class="guard-topbar"><div class="guard-who"><a class="brand" href="guard.html">P / TeamParker</a><span>G. Santos · Guard</span></div></header>
<main id="main" class="guard-main"><h1 class="guard-title">Correct a record</h1>
<div class="vehicle-id"><span class="plate">ABC-5678</span>
<p class="person"><strong>Maria Cruz</strong> <span>Entry at 08:14 · ENT-0157</span></p></div>
<form class="card form-card" action="guard.html" method="get"><input type="hidden" name="corrected" value="1">
<div class="row"><div class="field"><label for="c-area">Parking area</label>
<select id="c-area"><option>Area A</option><option selected>Area B</option><option disabled>Area C (full)</option></select></div>
<div class="field"><label for="c-time">Entry time</label>
<input id="c-time" type="datetime-local" value="2026-10-12T08:14"></div></div>
<p class="footnote">If you change the area, the old area gets one free slot back and the new area has one less.</p>
<div class="form-actions"><button class="guard-button primary" type="submit">Save correction</button>
<a class="guard-button" href="guard.html">Cancel</a></div></form></main></div>
</body>
</html>
